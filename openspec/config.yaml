  Tech stack: React 19, TypeScript 5.8, Vite 6, Tailwind CSS via CDN, lucide-react icons.
  Domain: bilingual Polish/English arithmetic worksheet generator and interactive exercise app for children.
  Routes: "/" renders the worksheet generator; "/test" renders interactive exercises.
  Key files: App.tsx, components/*.tsx, services/mathGenerator.ts, types.ts, locales.ts, index.html.
  Verification: no automated test suite currently; run "npm run build" and manually check affected generator, exercise, language, and print-preview flows.

